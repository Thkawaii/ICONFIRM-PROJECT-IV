# nginx สำหรับ production: เสิร์ฟหน้าเว็บ + proxy API ไป backend ในไฟล์เดียว
# server_name _  = รับทุก IP/ชื่อ -> ใช้ได้ทั้งวง 192.168.x.x และ 10.x.x.x

# HTTP -> เด้งไป HTTPS (กล้องสแกนบาร์โค้ดใช้ไม่ได้บน http ที่ไม่ใช่ localhost)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/iconfirm.crt;
    ssl_certificate_key /etc/nginx/certs/iconfirm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ไฟล์ Excel / รูปถ่าย (ค่า default ของ nginx แค่ 1MB — อัปโหลดจะ error 413)
    client_max_body_size 50m;

    root  /usr/share/nginx/html;
    index index.html;

    # API: /api/xxx -> http://backend:8080/xxx  (ตัด /api ออก เหมือน proxy ของ vite ตอน dev)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # upload/ประมวลผล Excel ใหญ่ๆ
        proxy_send_timeout 300s;
    }

    # เผื่อมีจุดไหนเรียกรูปแบบ /uploads/... ตรงๆ
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    # React Router: path ไหนไม่ใช่ไฟล์ ให้ส่ง index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
